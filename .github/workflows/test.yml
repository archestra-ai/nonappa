name: Test
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read # Check out source code for isolated build and packaging tests.
jobs:
  test:
    name: macOS tests and universal packaging
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash test.sh
      - run: bash scripts/test-release.sh
